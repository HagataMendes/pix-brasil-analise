name: Diagnóstico da API do Pix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/diagnostico.py"]

permissions:
  contents: write

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python src/diagnostico.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/_diagnostico.json
          git commit -m "Diagnóstico da API"
          git pull --rebase && git push
