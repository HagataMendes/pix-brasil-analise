name: Coleta mensal dos dados do Pix

on:
  schedule:
    - cron: "0 12 10 * *"   # todo dia 10, às 9h (Brasília)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/coleta.py", ".github/workflows/coleta.yml"]

permissions:
  contents: write

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas pyarrow requests
      - run: python src/coleta.py
      - name: Salva os dados no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          git diff --cached --quiet || git commit -m "Atualiza dados do Pix ($(date +%Y-%m-%d))"
          git push
